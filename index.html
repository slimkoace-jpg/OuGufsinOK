<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Служба в ГУФСИН</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #FDD835; 
            --card-bg: #2d2d2d;
            --tg-blue: #2AABEE;
            --wa-green: #25D366;
            --max-purple: #7B61FF;
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000; /* Черный фон для полей вокруг картинок */
            color: var(--text-color);
            overflow-x: hidden;
        }
        
        /* Контейнер для слайдов */
        .slider-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            height: 100vh;
            width: 100vw;
        }
        .slider-container::-webkit-scrollbar { display: none; }
        
        /* Слайд */
        .slide {
            flex: 0 0 100vw;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; /* Черный фон */
        }

        /* Картинки теперь вписываются целиком, без обрезки */
        .slide img.slide-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Вписывает картинку целиком */
            display: block;
        }

        /* Наложение QR-кода на 5-й слайд */
        .qr-overlay {
            position: absolute;
            bottom: 90px; 
            right: 20px;
            width: 80px; 
            height: 80px;
            background-color: white; 
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .qr-overlay img {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Экран с формой (6-й слайд) */
        .form-slide {
            background-color: var(--bg-color);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 40px;
            overflow-y: auto;
        }
        .form-slide h1 {
            color: var(--accent-color);
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: var(--card-bg);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 30px;
            font-size: 12px;
            color: #888;
        }
        .checkbox-group input { width: auto; margin-top: 3px; }
        
        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--accent-color);
            color: #000;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        
        /* Подсказка для свайпа */
        .nav-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            animation: pulse 2s infinite;
            z-index: 10;
            pointer-events: none;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* --- Кнопка связи и меню контактов --- */
        .fab-contact {
            position: fixed;
            bottom: 80px; 
            right: 20px;
            background-color: var(--accent-color);
            color: #000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 20;
            transition: transform 0.2s;
        }
        .fab-contact:active { transform: scale(0.9); }

        .contact-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 30; display: none; opacity: 0; transition: opacity 0.3s;
        }
        .contact-modal-overlay.active { display: block; opacity: 1; }

        .contact-modal {
            position: fixed; bottom: -100%; left: 0; right: 0;
            background: var(--bg-color); border-radius: 20px 20px 0 0;
            padding: 20px; z-index: 31; transition: bottom 0.3s ease-out;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5); max-height: 80vh; overflow-y: auto;
        }
        .contact-modal.active { bottom: 0; }
        
        .contact-modal h3 { text-align: center; margin-top: 0; margin-bottom: 20px; color: #fff; }

        .contact-item {
            background: var(--card-bg); border-radius: 12px; padding: 15px;
            margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        
        .contact-number {
            font-size: 18px; font-weight: bold; color: var(--text-color);
            text-decoration: none; display: flex; align-items: center; gap: 10px;
        }
        .contact-actions { display: flex; gap: 10px; }

        .action-btn {
            flex: 1; display: flex; justify-content: center; align-items: center;
            padding: 10px; border-radius: 8px; font-size: 18px;
            text-decoration: none; background: #444; color: white; transition: opacity 0.2s;
        }
        .action-btn:active { opacity: 0.7; }
        
        .action-btn.tg { background-color: var(--tg-blue); }
        .action-btn.wa { background-color: var(--wa-green); }
        .action-btn.max { background-color: var(--max-purple); }
        .action-btn.call { background-color: var(--accent-color); color: #000; }

        .contact-close {
            width: 100%; padding: 15px; margin-top: 10px;
            background: transparent; border: none; color: #888; font-size: 16px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="slider-container" id="slider">
        <!-- Слайды 1-4 (теперь через тег img) -->
        <div class="slide"><img src="1.jpg" class="slide-image" alt="Слайд 1"></div>
        <div class="slide"><img src="2.jpg" class="slide-image" alt="Слайд 2"></div>
        <div class="slide"><img src="3.jpg" class="slide-image" alt="Слайд 3"></div>
        <div class="slide"><img src="4.jpg" class="slide-image" alt="Слайд 4"></div>
        
        <!-- Слайд 5 (Критерии + QR-код) -->
        <div class="slide">
            <img src="5.jpg" class="slide-image" alt="Слайд 5">
            <a href="https://t.me/OUGUFSINOK_BOT" target="_blank" class="qr-overlay">
                <img src="qr.png" alt="QR код бота">
            </a>
        </div>

        <!-- Слайд 6 (Форма) -->
        <div class="slide form-slide">
            <h1>Анкета кандидата</h1>
            <form id="surveyForm">
                <div class="form-group">
                    <label>Ваше имя</label>
                    <input type="text" id="name" placeholder="Иван" required>
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="phone" placeholder="+7 (999) 000-00-00" required>
                </div>
                <div class="form-group">
                    <label>Возраст</label>
                    <select id="age" required>
                        <option value="">Выберите...</option>
                        <option value="Младше 21">Младше 21</option>
                        <option value="21-30">От 21 до 30 лет</option>
                        <option value="Старше 30">Старше 30 лет</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Образование</label>
                    <select id="education" required>
                        <option value="">Выберите...</option>
                        <option value="Среднее">Среднее</option>
                        <option value="Среднее специальное">Среднее специальное</option>
                        <option value="Высшее">Высшее</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Годность по здоровью</label>
                    <select id="health" required>
                        <option value="">Выберите...</option>
                        <option value="А">А (годен)</option>
                        <option value="Б">Б (годен с незначительными ограничениями)</option>
                        <option value="В/Г/Д">В, Г или Д</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Служба в Вооруженных силах</label>
                    <select id="military" required>
                        <option value="">Выберите...</option>
                        <option value="Проходил(а)">Проходил(а) службу</option>
                        <option value="Не проходил(а)">Не проходил(а) службу</option>
                        <option value="Не служил(а), но готов(а)">Не служил(а), но готов(а)</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="consent" required>
                    <label for="consent" style="margin: 0;">Я согласен на обработку персональных данных.</label>
                </div>
                <button type="submit" class="submit-btn">Отправить анкету</button>
            </form>
        </div>
    </div>

    <div class="nav-hint" id="navHint">← Свайпните влево →</div>

    <div class="fab-contact" id="fabContact">📞</div>

    <!-- Модальное окно контактов -->
    <div class="contact-modal-overlay" id="modalOverlay"></div>
    <div class="contact-modal" id="contactModal">
        <h3>Связаться с нами</h3>
        
        <div class="contact-item">
            <a href="tel:+74232305443" class="contact-number">📞 +7 (423) 230-54-43</a>
            <div class="contact-actions">
                <a href="tel:+74232305443" class="action-btn call">Позвонить</a>
            </div>
        </div>

        <div class="contact-item">
            <a href="tel:+79140729179" class="contact-number">📱 +7 (914) 072-91-79</a>
            <div class="contact-actions">
                <a href="tel:+79140729179" class="action-btn call" title="Позвонить">📞</a>
                <a href="https://t.me/+79140729179" target="_blank" class="action-btn tg" title="Telegram">✈️</a>
                <a href="https://wa.me/79140729179" target="_blank" class="action-btn wa" title="WhatsApp">💬</a>
                <a href="https://max.ru/u/f9LHodD0cOLGl8Up4rrZUsTKlqkixbY8ua5Ud4hTXgJGntAWpbntom8TxwM" target="_blank" class="action-btn max" title="МАКС">🟣</a>
            </div>
        </div>

        <div class="contact-item">
            <a href="tel:+79996179381" class="contact-number">📱 +7 (999) 617-93-81</a>
            <div class="contact-actions">
                <a href="tel:+79996179381" class="action-btn call" title="Позвонить">📞</a>
                <a href="https://t.me/+79996179381" target="_blank" class="action-btn tg" title="Telegram">✈️</a>
                <a href="https://wa.me/79996179381" target="_blank" class="action-btn wa" title="WhatsApp">💬</a>
                <a href="https://max.ru/u/79996179381" target="_blank" class="action-btn max" title="МАКС">🟣</a>
            </div>
        </div>
        <button class="contact-close" id="closeContactBtn">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#1a1a1a');

        const slider = document.getElementById('slider');
        const navHint = document.getElementById('navHint');
        const mainButton = tg.MainButton;
        
        const fab = document.getElementById('fabContact');
        const modal = document.getElementById('contactModal');
        const overlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('closeContactBtn');

        function openModal() { modal.classList.add('active'); overlay.classList.add('active'); }
        function closeModal() { modal.classList.remove('active'); overlay.classList.remove('active'); }
        fab.addEventListener('click', openModal);
        overlay.addEventListener('click', closeModal);
        closeBtn.addEventListener('click', closeModal);

        slider.addEventListener('scroll', () => {
            navHint.style.display = 'none';
            const slideWidth = window.innerWidth;
            const currentSlide = Math.round(slider.scrollLeft / slideWidth);
            
            if (currentSlide === 4) {
                if (!mainButton.isVisible) {
                    mainButton.setText("ЗАПОЛНИТЬ АНКЕТУ");
                    mainButton.show();
                    mainButton.onClick(() => {
                        slider.scrollTo({ left: window.innerWidth * 5, behavior: 'smooth' });
                    });
                }
            } else {
                if (mainButton.isVisible) { mainButton.hide(); }
            }
        });

        document.getElementById('surveyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                age: document.getElementById('age').value,
                education: document.getElementById('education').value,
                health: document.getElementById('health').value,
                military: document.getElementById('military').value
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        });

        document.querySelectorAll('a[href^="http"], a[href^="tel:"]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                tg.openLink(e.currentTarget.href);
            });
        });
    </script>
</body>
</html>
